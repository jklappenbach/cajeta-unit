name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Builds the library .cja on a main push; on a v* tag also publishes a GitHub
# Release and a signed publish to Olla. Logic lives in the reusable workflow.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # Pin explicitly. Omitting this inherits the reusable workflow's default,
      # which is how this repo silently built against v0.7.1 — a toolchain that
      # parses neither the annotation declarations (`@Test`, `@BeforeEach`,
      # `@Disabled`) nor the bracket array literals these sources have used since
      # the collection-literals migration.
      # Raised to v0.12.1 with the unit-7 tour rewrite: the expanded tour is
      # authored and verified against the 0.12 line.
      cajeta-version: v0.12.1
      # `cajeta test` builds SelfTest and runs it. SelfTest deliberately
      # hand-verifies the engine before trusting it, then runs the reflective
      # @Test suite through the now-trusted engine — you cannot test a test
      # framework with itself unbootstrapped.
      test-command: ./scripts/ci-checks.sh
    secrets: inherit
