name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Builds the library .cja on a main push; on a v* tag also publishes a GitHub
# Release and a signed publish to Olla. Logic lives in the reusable workflow.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # Pin explicitly. Omitting this inherits the reusable workflow's default,
      # which is how this repo silently built against v0.7.1 — a toolchain that
      # parses neither the annotation declarations (`@Test`, `@BeforeEach`,
      # `@Disabled`) nor the bracket array literals these sources have used since
      # the collection-literals migration.
      # Raised to v0.12.1 with the unit-7 tour rewrite: the expanded tour is
      # authored and verified against the 0.12 line.
      # Raised to v0.18.0 for the 0.2.2 cut — the latest published release.
      # Nothing here needs 0.18 (the bounded-discovery Runner has been fine
      # since v0.16.0), but a consumer pinned below this floor cannot build the
      # archive at all: cajeta-codec sat at v0.15.0 and its CI died on
      # `classesWithMethodAnnotated` before a single test ran. Keeping this at
      # the current release makes the floor explicit rather than discovered.
      # Raised to v0.21.1 for the 0.2.3 cut, and this time it IS required, not
      # just current: 0.2.3 is the ownership pass, and the two checks that
      # forced it — CAJETA_ERROR_OWNED_RESULT_NEEDS_TRANSFER and
      # CAJETA_ERROR_CAPTURED_BORROW_PARAM — are what an older toolchain does
      # not have. Building 0.2.3 below this floor would compile sources whose
      # `#=` spellings it cannot parse.
      # Raised to v0.26.0 for the 0.2.4 cut. This one is a refresh, not a new
      # floor: 0.2.4 carries no source change. The point of the tag is that the
      # published archive be built by the toolchain the rest of the ecosystem is
      # now pinned to, so consumers stop resolving an artifact compiled by a
      # compiler five releases behind the one they build against.
      cajeta-version: v0.26.0
      # `cajeta test` builds SelfTest and runs it. SelfTest deliberately
      # hand-verifies the engine before trusting it, then runs the reflective
      # @Test suite through the now-trusted engine — you cannot test a test
      # framework with itself unbootstrapped.
      test-command: ./scripts/ci-checks.sh
    secrets: inherit
